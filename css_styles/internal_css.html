<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            background-color: black;
            color: brown;
        }

        h2{
            background-color: aqua;
            color: blueviolet;
            border: 3px solid black;
        }

        .heading{
            background-color: yellow;
            color: blue;
        }

        .bg-danger{
            background-color: red;
            color: white;
        }

        .border-success{
            border: 3px solid green;
        }

        .bg-primary{
            background-color: blue;
        }

        .text-white{
            color: white;
        }
    </style>
</head>
<body>
    <h1>Internal css</h1>
    <h2>Welcome to css journey</h2>
    <h1 class="heading">Python Django</h1>
    <h1 class="bg-danger border-success">Django Restframework</h1>
    <h1 class="bg-primary text-white">ASP.NET</h1>
</body>
</html>
