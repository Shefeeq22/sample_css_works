<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- product card 1 -->
     <div class="card">

        <div class="badge">
            10% off
        </div>

        <!-- product image -->
        <div class="card-image">
            <img src="./image/ryan-waring-164_6wVEHfI-unsplash.jpg" alt="">
        </div>

        <div class="card-content">
            <!-- product heading -->
         <h1 class="card-heading">Product Name</h1>

          <p class="card-text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Vel reprehenderit suscipit placeat, officia voluptatibus provident facere nulla in assumenda mollitia omnis sit, dicta esse aspernatur libero beatae harum id quisquam.</p>

            <div class="card-footer">
                <button>Add to cart</button>
            </div>
        </div>

     </div>

</html>
